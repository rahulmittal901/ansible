# Service to expose the deployment
apiVersion: v1
kind: Service
metadata:
  name: efs-demo-service
  namespace: default
  labels:
    app: efs-demo
spec:
  selector:
    app: efs-demo
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
